# Example only. Do not enable this on the live vhost during implementation.
# Do not rsync --delete the IONOS document root. Child-app directories stay where they are.
#
# After `npm run export`, copy these folders beside WordPress, without deleting anything else:
#   out/_next     ->  DOCUMENT_ROOT/_next
#   out/brand     ->  DOCUMENT_ROOT/brand
#   out/en        ->  DOCUMENT_ROOT/cme-static/en
#   out/es        ->  DOCUMENT_ROOT/cme-static/es
#   out/pt-br     ->  DOCUMENT_ROOT/cme-static/pt-br
#   out/contact-submit.php -> DOCUMENT_ROOT/contact-submit.php
# Place the real mail file outside the web root and point CME_MAIL_CONFIG at it.
# Rollback is commenting out this block. WordPress and the child apps stay on disk.

<IfModule mod_rewrite.c>
  RewriteEngine On

  # Public /en duplicates the unprefixed English pages. Send visitors to the public URL.
  RewriteRule ^en/?$ / [R=302,L]
  RewriteRule ^en/(.*)$ /$1 [R=302,L]

  # The document root is itself a directory, so this rule has to run before the
  # "real directory" short-circuit or WordPress would keep serving the home page.
  RewriteRule ^$ /cme-static/en/index.html [L]

  # Exported HTML under /cme-static, plus any real file or directory
  # (child-app trees, WordPress, contact-submit.php, /_next, /brand).
  RewriteCond %{REQUEST_URI} ^/cme-static/
  RewriteCond %{REQUEST_FILENAME} -f
  RewriteRule ^ - [L]

  RewriteCond %{REQUEST_URI} !^/cme-static/
  RewriteCond %{REQUEST_FILENAME} -f [OR]
  RewriteCond %{REQUEST_FILENAME} -d
  RewriteRule ^ - [L]

  # English marketing pages. The static export keeps them under /en; Apache exposes
  # the unprefixed paths. These names are not child-app directories.
  RewriteRule ^(business-it|smart-home|security|contact|app-center)/?$ /cme-static/en/$1/index.html [L]

  # Spanish and Portuguese are already prefixed.
  RewriteRule ^(es|pt-br)/?$ /cme-static/$1/index.html [L]
  RewriteRule ^(es|pt-br)/([A-Za-z0-9-]+)/?$ /cme-static/$1/$2/index.html [L]
</IfModule>

# Child paths that must keep returning their own apps (all HTTP 200 on 8 Nov 2026):
# anibal-handyman, organic-house-cleaning, russ-bogun-auto, gt-details, chairside,
