# CME block only. On the live IONOS file this must be inserted immediately
# BEFORE the first rewrite catch-all (the unmarked block, originally lines
# 106-113). Inserting it above the marked WordPress block is too late:
# that marked block is the second catch-all.
#
# Do not add RewriteRule ... - [L] for the 26 app names. Only biblical-pharmacy
# is a real directory. The other 25 are WordPress routes and must still reach
# the existing catch-all. These rules name only the v5 marketing URLs, so the
# app URLs are unchanged.

<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteBase /
    RewriteRule ^en/?$ / [R=302,L]
    RewriteRule ^en/(.+)$ /$1 [R=302,L]
    RewriteRule ^$ /cme-static/en/index.html [L]
    RewriteRule ^(__next\.[^/]+\.txt)$ /cme-static/en/$1 [L]
    RewriteRule ^(business-it|smart-home|security|contact|app-center)/?$ /cme-static/en/$1/index.html [L]
    RewriteRule ^(business-it|smart-home|security|contact|app-center)/(__next\.[^/]+\.txt)$ /cme-static/en/$1/$2 [L]
    RewriteRule ^(es|pt-br)/?$ /cme-static/$1/index.html [L]
    RewriteRule ^(es|pt-br)/(__next\.[^/]+\.txt)$ /cme-static/$1/$2 [L]
    RewriteRule ^(es|pt-br)/([A-Za-z0-9-]+)/?$ /cme-static/$1/$2/index.html [L]
    RewriteRule ^(es|pt-br)/(business-it|smart-home|security|contact|app-center)/(__next\.[^/]+\.txt)$ /cme-static/$1/$2/$3 [L]
</IfModule>
